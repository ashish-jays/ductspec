# Frozen corpus manifest.
#
# UFGS (Unified Facilities Guide Specifications) are prepared by USACE / NAVFAC /
# AFCEC / NASA and are works of the US federal government, in the public domain.
# They stand in for "an organisation's own documents" (Track 1, PS #3) as a public
# surrogate, so the dataset can be published in full.
#
# split: train | holdout
#   The holdout is a whole CORPUS from a different issuing authority. VA
#   PG-18-1 states requirements in different words and marks the engineer's
#   unmade choices differently: UFGS writes "[A] [B]", VA writes "//A// //B//"
#   and says so itself ("Delete between //   // if not applicable to project").
#   A model that learned "do not cite square brackets" fails this holdout; one
#   that learned "do not cite a choice nobody has made" transfers. Holding out
#   one more UFGS section would not have told us which we had trained.
#
# convention: which editing marks the issuing authority uses (see conventions.py)

sources:
  - id: UFGS-23-30-00
    title: HVAC Air Distribution
    url: https://www.wbdg.org/FFC/DOD/UFGS/UFGS%2023%2030%2000.pdf
    split: train
  - id: UFGS-23-07-00
    title: Thermal Insulation for Mechanical Systems
    url: https://www.wbdg.org/FFC/DOD/UFGS/UFGS%2023%2007%2000.pdf
    split: train
  - id: UFGS-23-05-93
    title: Testing, Adjusting, and Balancing for HVAC
    url: https://www.wbdg.org/FFC/DOD/UFGS/UFGS%2023%2005%2093.pdf
    split: train
  - id: UFGS-23-08-00
    title: Commissioning of HVAC Systems
    url: https://www.wbdg.org/FFC/DOD/UFGS/UFGS%2023%2008%2000.pdf
    split: train
  - id: UFGS-22-00-00
    title: Plumbing, General Purpose
    url: https://www.wbdg.org/FFC/DOD/UFGS/22%2000%2000.pdf
    split: train
  # Dropped. This section publishes no table of contents, so its headings
  # cannot be validated against the document's own list, and its text layer
  # splits words ("Shop fabricate d ucts"). Quotes taken from it would not
  # survive the quote-fidelity gate, and a requirement whose quote cannot be
  # checked against the page is exactly what this project refuses to ship.
  # It contributed 6 of 158 candidates.

  # Held out: a different authority, different wording, different editing marks.
  - id: VA-23-31-00
    title: HVAC Ducts and Casings (VA PG-18-1)
    url: https://www.wbdg.org/FFC/VA/VANCAS/VANCA233100.pdf
    split: holdout
    convention: va
  - id: VA-23-07-11
    title: HVAC Insulation (VA PG-18-1)
    url: https://www.wbdg.org/FFC/VA/VANCAS/VANCA230711.pdf
    split: holdout
    convention: va

  # --- Other authorities, added so the model sees more than one way of writing
  # a specification. These are owner and agency design standards in the CSI
  # three-part format: they letter paragraphs ("1.4.A", "2.01.B"), write
  # exceptions and system-specific rules in prose, and some still carry
  # brackets for choices nobody has made. Unlike UFGS and VA they are not US
  # federal works, so their text is not public domain. The dataset quotes only
  # the short sentence each requirement rests on, with its source, clause and
  # page, for research use; see the dataset card.
  #
  # split: validation holds out one whole authority, so choosing between
  # training recipes can be judged on an issuer the model never trained on
  # without looking at the VA test set.
  # Ohio is the one held out: clean text, and system-specific material rules of
  # the same kind the VA test asks about. NYCHA's text layer splits words
  # ("rei nforcement") and it states one checkable rule, too few to choose on.
  - id: OFCC-23-31-13
    title: Low-Pressure Ductwork (Ohio School Design Manual, 2024)
    publisher: Ohio Facilities Construction Commission
    url: https://dam.assets.ohio.gov/image/upload/ofcc.ohio.gov/OSDM/Files/23_31_13-low-pressure_ductwork.pdf
    split: validation
    convention: csi
    license: state agency publication; short quotes with attribution
  - id: DARTMOUTH-23-31-13
    title: Ductwork (Design and Construction Guidelines, January 2023)
    publisher: Dartmouth College
    url: https://www.dartmouth.edu/fom/docs/2023_construction_guidelines/23_31_13_ductwork.pdf
    split: train_only
    convention: csi
    license: copyrighted; short quotes with attribution
  - id: UH-23-31-13
    title: Ductwork (Master Construction Specifications)
    publisher: University of Houston
    url: https://www.uh.edu/facilities-planning-construction/vendor-resources/owners-design-criteria/master-specs/pdf/23-31-13-ductwork.pdf
    split: train_only
    convention: csi
    license: copyrighted; short quotes with attribution
  - id: NYCHA-23-31-13
    title: Metal Ducts (Design Guidelines, 2024)
    publisher: New York City Housing Authority
    url: https://designguidelines.nycha.info/wp-content/uploads/2024/06/23-31-13-Metal-Ducts.pdf
    split: train_only
    convention: csi
    license: copyrighted; short quotes with attribution
