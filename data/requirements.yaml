# Requirements extracted from the frozen corpus by a strong teacher model
# (Claude Opus, in session) reading each clause.
#
# This is the ONLY step in the dataset with a model's judgement in it. Every
# other layer is derived: given a requirement and an object, the verdict is
# computed, not predicted. So this file is the thing to audit, and it is built
# to be auditable — each record carries the exact `quote` it was read from,
# plus the source, clause id and page, so a reviewer can open the PDF and
# check it against the page.
#
# A correction worth recording. This file first cited the VA liner requirement
# as clause 2.2.B with no conditions. Both were wrong: a bug in the designer-
# note stripper had deleted the heading "2.3 DUCT LINER (WHERE INDICATED ON
# DRAWINGS)", which both renumbered the paragraph and removed the condition
# that limits it. The requirement would have entered the dataset as universal,
# under an id that does not exist. That is the project's own failure mode —
# asserting a requirement nobody adopted — committed by its own parser, which
# is why every requirement here is audited against the PDF page rather than
# against parser output.
#
# predicate:
#   in        — the observed value must be one of `values`
#   at_least  — the observed value must be >= `value` (numeric)
#   reference — this clause states no requirement itself; it points at another
#               document. If that document is not in the packet, the correct
#               answer is MISSING_AUTHORITY.
#
# applies_to.systems: [] means every system.

requirements:

  # --- UFGS 23 30 00, HVAC Air Distribution -------------------------------
  - id: R-UFGS-2.12.10.1-material
    source: UFGS-23-30-00
    clause_id: 2.12.10.1
    page: 35
    property: material
    applies_to: {systems: [], element: plenum_or_casing}
    predicate: {op: in, values: [galvanized_steel]}
    quote: "Construct system casing of not less than 1.6 mm 16 gauge galvanized sheet steel."

  - id: R-UFGS-2.12.11.3-liner
    source: UFGS-23-30-00
    clause_id: 2.12.11.3
    page: 37
    property: insulation_thickness_in
    applies_to: {systems: [], element: acoustical_liner}
    predicate: {op: at_least, value: 1.0}
    quote: "Provide not less than 25 mm 1 inch thick coated lining."

  - id: R-UFGS-2.12.17-material
    source: UFGS-23-30-00
    clause_id: 2.12.17
    page: 42
    property: material
    applies_to: {systems: [], element: double_wall_inner}
    predicate: {op: in, values: [galvanized_steel]}
    quote: "provide double wall pre-insulated ductwork with minimum 24 gauge solid galvanized inner wall"

  - id: R-UFGS-2.12.1.1-pressure
    source: UFGS-23-30-00
    clause_id: 2.12.1.1
    page: 29
    property: pressure_rating_in_wg
    applies_to: {systems: [], element: metallic_flexible_duct}
    predicate: {op: at_least, value: 2.0}
    quote: "Provide ducts designed for working pressures of 497 Pa 2 inches water gauge positive pressure"

  - id: R-UFGS-3.2.7.2-material
    source: UFGS-23-30-00
    clause_id: 3.2.7.2
    page: 80
    property: material
    applies_to: {systems: [kitchen_exhaust], element: exposed_ductwork}
    predicate: {op: in, values: [stainless_steel_304, stainless_steel_316]}
    quote: "Provide exposed ductwork that is fabricated from minimum 1.3 mm 18 gauge , Type 304L or 316L, stainless steel with continuously welded joints and seams."

  - id: R-UFGS-3.2.5.1-material
    source: UFGS-23-30-00
    clause_id: 3.2.5.1
    page: 78
    property: material
    applies_to: {systems: [], element: underground_duct}
    predicate: {op: in, values: [galvanized_steel]}
    quote: "PVS must consist of prime, hot-dipped, G-90 galvanized steel"

  # States no requirement of its own; defers to another section. When that
  # section is absent from the packet the model knows a requirement exists and
  # cannot state it — which is MISSING_AUTHORITY, not NON_COMPLIANT.
  - id: R-UFGS-3.2.11-reference
    source: UFGS-23-30-00
    clause_id: 3.2.11
    page: 81
    property: insulation_thickness_in
    applies_to: {systems: [], element: duct}
    predicate: {op: reference, target: UFGS-23-07-00}
    quote: "Provide thickness and application of insulation materials for ductwork, piping, and equipment according to Section 23 07 00 THERMAL INSULATION FOR MECHANICAL SYSTEMS."

  # --- UFGS 23 07 00, Thermal Insulation ----------------------------------
  - id: R-UFGS-2.4.5-insulation
    source: UFGS-23-07-00
    clause_id: 2.4.5
    page: 24
    property: insulation_thickness_in
    applies_to: {systems: [kitchen_exhaust], element: duct}
    predicate: {op: at_least, value: 2.0}
    quote: "Ensure insulation thickness is a minimum of 50 mm 2 inches , blocks or boards"
    note: >-
      The clause then offers a choice of insulating material that the designer
      has not made. The 2 inch minimum holds either way, so the thickness is
      citable while the material is not.

  # --- VA PG-18-1 23 31 00 — HELD OUT, different authority ----------------
  - id: R-VA-2.1.A-material
    source: VA-23-31-00
    clause_id: 2.1.A
    page: 7
    property: material
    applies_to: {systems: [], element: duct}
    predicate: {op: in, values: [galvanized_steel, aluminum]}
    quote: "construct ducts and accessories of galvanized sheet steel, ASTM A653/A653M, coating G90; or, aluminum sheet, ASTM B209, alloy 1100, 3003, or 5052."

  - id: R-VA-2.3.B-liner
    source: VA-23-31-00
    clause_id: 2.3.B
    page: 9
    property: insulation_thickness_in
    applies_to: {systems: [], element: acoustical_liner, condition: lining_indicated_on_drawings}
    predicate: {op: at_least, value: 1.0}
    quote: "Rectangular Duct Liner: ASTM C1071, Type I (flexible), or Type II (board), 25 mm (one inch) minimum thickness"
    note: >-
      The parent heading is "2.3 DUCT LINER (WHERE INDICATED ON DRAWINGS)", so
      the requirement is conditional: it binds only where the drawings call for
      lining. If the object does not establish whether lining is indicated, the
      answer is APPLICABILITY_UNKNOWN, not a thickness comparison. An earlier
      version of this file cited it as 2.2.B with no condition, because the
      parser had deleted the heading — see the note at the top of this file.

