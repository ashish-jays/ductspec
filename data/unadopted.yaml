  # --- Other authorities (dataset v2), train only. The same idea as UFGS's
  # "[A] [B]", written by other issuers: Houston keeps brackets, Dartmouth
  # hands the choice to the designer in prose. A model that learned "brackets
  # mean refuse" fails the prose one; one that learned "nobody has chosen yet"
  # gets both.

  - id: U-DART-3.2.B-material
    source: DARTMOUTH-23-31-13
    clause_id: 3.2.B
    page: 10
    property: material
    applies_to: {systems: [kitchen_exhaust, lab_exhaust], element: duct}
    probe: false
    train_only: true
    drawn_values: [stainless_steel_304, black_iron]
    quote: "Lab, Pools, Kitchen and other special applications ductwork material shall be determined by the designer."

