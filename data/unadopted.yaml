# Clauses that state a choice nobody has made.
#
# A guide specification offers the designer alternatives side by side and asks
# them to pick: UFGS writes "[A] [B]". Until they do, the clause imposes
# nothing, and a review that judges a duct against one of the options has
# invented a requirement.
#
# These are not requirements, so they are not in requirements.yaml. They are
# kept here because being shown one and declining to treat it as settled is
# part of the task. Every quote is copied from the clause it is attributed to;
# tests/test_probes.py checks each against the PDF when the corpus is fetched,
# and checks that the document's own convention marks it as an unmade choice.
#
# probe: true
#   Never trained on, in either arm. UFGS 3.2.7.1 is the unmade choice the
#   raw arm trains on as settled: the raw extraction recorded it as "stainless
#   steel, every system". Its packets go to the test set only, in
#   their own panel, so the evaluation asks the question the raw arm was taught
#   the wrong answer to.
#
# probe: false
#   Other unmade choices from the same section, split by family like everything
#   else. They are what gives a model the chance to learn the convention rather
#   than one clause id.
#
# drawn_values are what the generator letters on the sheet for these packets.
# They say nothing about the clause.

unadopted:
  - id: U-UFGS-3.2.7.1-material
    source: UFGS-23-30-00
    clause_id: 3.2.7.1
    page: 79
    property: material
    applies_to: {systems: [kitchen_exhaust], element: duct}
    probe: true
    drawn_values: [stainless_steel_304, black_iron]
    quote: "Provide duct material that is a [minimum 1.3 mm 18 gauge , Type 304L or 316L, stainless steel] [minimum 1.6 mm 16 gauge carbon steel]."

